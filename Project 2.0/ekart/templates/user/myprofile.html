{% extends 'base.html' %}{% block title %}My Profile{% endblock %}{% block content %}<div class="container py-5" style="max-width:700px"><div class="card p-4 shadow-sm"><h2>My Profile</h2>{% for message in messages %}<div class="alert alert-success">{{ message }}</div>{% endfor %}<p><b>Email:</b> {{ request.user.email }}</p><form method="post" enctype="multipart/form-data">{% csrf_token %}<label class="form-label">Name</label><input class="form-control mb-3" name="name" value="{{ request.user.first_name }}" required><label class="form-label">Mobile</label><input class="form-control mb-3" name="mobile" value="{{ profile.mobile }}"><label class="form-label">Address</label><textarea class="form-control mb-3" name="address">{{ profile.address }}</textarea><label class="form-label">Profile photo</label><input class="form-control mb-3" type="file" name="myfile" accept="image/*"><button class="btn btn-success">Update Profile</button></form></div></div>{% endblock %}
