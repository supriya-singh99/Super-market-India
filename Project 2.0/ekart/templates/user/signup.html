{% extends 'base.html' %}
{% block title %}Sign Up | Supermarket India{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:620px"><div class="card shadow-sm border-0"><div class="card-body p-4"><h2 class="text-center mb-4">Create Account</h2>{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}<form method="post" enctype="multipart/form-data">{% csrf_token %}<label class="form-label">Full name</label><input type="text" name="name" class="form-control mb-3" required><label class="form-label">Date of birth</label><input type="date" name="dob" class="form-control mb-3"><label class="form-label">Mobile number</label><input type="tel" name="mobile" class="form-control mb-3" required><label class="form-label">Email</label><input type="email" name="email" class="form-control mb-3" required><label class="form-label">Password</label><input type="password" name="passwd" class="form-control mb-3" minlength="8" required><label class="form-label">Profile photo (optional)</label><input type="file" name="myfile" accept="image/*" class="form-control mb-3"><label class="form-label">Address</label><textarea name="address" class="form-control mb-3" rows="3" required></textarea><button class="btn btn-success w-100" type="submit">Create Account</button></form><p class="text-center mt-3 mb-0">Already registered? <a href="/signin/">Sign in</a></p></div></div></div>
{% endblock %}
